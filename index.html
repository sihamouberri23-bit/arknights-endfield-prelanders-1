<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arknights: Endfield – Play Free on Windows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Oxanium:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--yellow:#FFF200;--black:#0b0b0c;--white:#f4f4f2}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--black);color:var(--white);font-family:'Chakra Petch',sans-serif}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  .stage{position:relative;height:100vh;height:100svh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden}
  .bg{position:absolute;inset:0;background:url('https://pub-f40ac40689ba4dc98e8fbd45d5a02c91.r2.dev/arknights1.jpeg') center 30%/cover no-repeat;animation:drift 18s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1.05)}to{transform:scale(1.14) translateX(-1.5%)}}
  .shade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(11,11,12,.55) 0%,rgba(11,11,12,0) 20%,rgba(11,11,12,0) 38%,rgba(11,11,12,.88) 70%,var(--black) 100%)}
  .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px)}

  .topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 4vw}
  .brand{display:inline-flex;flex-direction:column;align-items:stretch}
  .ark{display:block;font-family:'Oxanium',sans-serif;font-weight:800;font-size:clamp(7px,.75vw,10px);letter-spacing:0;text-align:justify;text-align-last:justify;color:var(--white);width:62%;margin:0 0 5px 2px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .logo{width:clamp(120px,15vw,210px);display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)) drop-shadow(0 4px 16px rgba(0,0,0,.45))}
  .tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--black);background:var(--yellow);padding:6px 10px}
  .tag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e01a1a;margin-right:6px;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}

  .panel{position:relative;z-index:4;width:min(1000px,94vw);margin-bottom:clamp(20px,6vh,60px);text-align:center}
  .step{display:none;animation:in .35s ease}
  .step.active{display:block}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .kicker{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.3em;color:var(--yellow);text-transform:uppercase;background:rgba(0,0,0,.65);padding:5px 10px;margin-bottom:12px}
  h1{font-family:'Oxanium',sans-serif;font-weight:800;font-size:clamp(26px,4.4vw,52px);line-height:1.05;text-transform:uppercase;text-shadow:0 4px 30px rgba(0,0,0,.8)}
  h1 span{color:var(--yellow)}
  .sub{margin:12px auto 0;max-width:560px;font-size:clamp(14px,1.5vw,18px);color:#ddd;line-height:1.45}

  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
  .opt{position:relative;padding:16px 12px;background:rgba(15,15,17,.82);border:1.5px solid rgba(255,255,255,.22);text-align:left;transition:.18s;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
  .opt:hover{border-color:var(--yellow);background:rgba(255,242,0,.12);transform:translateY(-2px)}
  .opt small{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--yellow);letter-spacing:.2em;margin-bottom:6px}
  .opt b{display:block;font-family:'Oxanium',sans-serif;font-size:clamp(15px,1.6vw,19px);text-transform:uppercase}
  .opt span{display:block;margin-top:4px;font-size:13px;color:#bbb}

  .dots{display:flex;justify-content:center;gap:6px;margin-top:18px}
  .dots i{width:26px;height:4px;background:rgba(255,255,255,.25)}
  .dots i.on{background:var(--yellow)}

  /* scanning step */
  .term{margin:20px auto 0;max-width:460px;text-align:left;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.9;background:rgba(0,0,0,.7);border-left:3px solid var(--yellow);padding:14px 18px;min-height:150px}
  .term div{opacity:0;transition:opacity .2s}
  .term div.show{opacity:1}
  .term .ok{color:var(--yellow)}
  .bar{height:6px;background:rgba(255,255,255,.15);margin:14px auto 0;max-width:460px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width 2.4s linear}

  /* CTA */
  .cta-wrap{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,24px)}
  .chev{display:flex;gap:2px}
  .chev i{display:block;width:clamp(16px,2.2vw,30px);height:clamp(30px,4.2vw,56px);background:var(--yellow);clip-path:polygon(0 0,45% 0,100% 50%,45% 100%,0 100%,55% 50%);opacity:.2;animation:chev 1.2s infinite}
  .chev i:nth-child(2){animation-delay:.15s}.chev i:nth-child(3){animation-delay:.3s}
  .chev.r{transform:scaleX(-1)}
  @keyframes chev{0%,100%{opacity:.15}40%{opacity:1}}
  .cta{position:relative;display:inline-flex;align-items:center;gap:18px;font-family:'Oxanium',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
    font-size:clamp(22px,3.4vw,44px);color:var(--black);background:var(--yellow);padding:clamp(20px,2.8vw,32px) clamp(30px,5vw,80px);white-space:nowrap;overflow:hidden;
    clip-path:polygon(24px 0,100% 0,100% calc(100% - 24px),calc(100% - 24px) 100%,0 100%,0 24px);animation:pulse 1.8s infinite;transition:transform .15s}
  .cta:hover{transform:scale(1.04)}
  .cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);animation:shine 2.4s infinite}
  @keyframes shine{0%{left:-60%}60%,100%{left:130%}}
  @keyframes pulse{50%{filter:drop-shadow(0 0 22px rgba(255,242,0,.8))}}
  .cta svg{width:1.1em;height:1.1em;flex:none}
  .note{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:#cfcfcf}
  .note b{color:var(--yellow);font-weight:500}
  .legal{position:absolute;z-index:4;bottom:8px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.05em;padding:0 12px;pointer-events:none}

  @media (max-width:640px){
    .opts{grid-template-columns:1fr;gap:8px}
    .opt{padding:12px 14px}
    .opt span{display:none}
    .chev{display:none}
    .tag{font-size:9px;letter-spacing:.1em}
    .bg{background-position:62% 20%}
    .kicker{font-size:10px;letter-spacing:.18em}
  }
  @media (max-width:640px){h1{font-size:28px}.sub{font-size:15px}.cta{font-size:20px;gap:12px;padding:20px 26px}}
  @media (max-height:640px){.sub{display:none}.opts{margin-top:14px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="stage">
  <a href="#go2offer" class="bg" aria-label="Play Arknights: Endfield free"></a><div class="shade"></div><div class="scan"></div>

  <div class="topbar">
    <a href="#go2offer" class="brand"><span class="ark">A R K N I G H T S</span><img class="logo" src="https://end.eliteplayhub.com/image/logo-endfield-v2.png" alt="Arknights: Endfield"></a>
    <span class="tag"><i></i>TALOS-II // LIVE</span>
  </div>

  <div class="panel">

    <section class="step active">
      <div class="kicker">// Ready</div>
      <h1>Your game is <span>ready!</span></h1>
      <p class="sub">Click below and play Arknights: Endfield free.</p>
      <div class="cta-wrap">
        <div class="chev"><i></i><i></i><i></i></div>
        <a href="#go2offer" class="cta">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 4.5 10 3.4v7.8H2V4.5Zm0 15 8 1.1v-7.7H2v6.6Zm9 1.2 11 1.5v-9.3H11v7.8Zm0-17.4v7.9h11V1.8L11 3.3Z"/></svg>
          Play Free on Windows
        </a>
        <div class="chev r"><i></i><i></i><i></i></div>
      </div>
      <div class="note"><b>100% FREE</b> · No credit card · Instant play</div>
    </section>
  </div>
  <div class="legal">Unofficial promotional page. Arknights: Endfield is a trademark of its respective owners.</div>
</main>
</body>
</html>
